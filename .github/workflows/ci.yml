name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: npm ci
      - run: ruff check .
      - run: pytest -q --cov=openultra_browser --cov-report=xml:coverage.xml --cov-fail-under=80
      - run: npm test
      - run: python -m build
